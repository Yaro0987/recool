<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>var _b=location.pathname.replace(/\/+$/,'').split('/');document.write('<base href="/'+(_b[1]?_b[1]+'/':'')+'" />');</script>
  <title>Recool — Premium Footwear</title>
  <link rel="icon" href="imgs/general/favicon.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="description" content="Premium footwear curated for style and comfort. Discover the latest drops from top brands." />
  <meta property="og:title" content="Recool — Premium Footwear" />
  <meta property="og:description" content="Premium footwear curated for style and comfort. Discover the latest drops from top brands." />
  <meta property="og:image" content="imgs/general/favicon.jpg" />
  <meta property="og:url" content="" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Recool" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Recool — Premium Footwear" />
  <meta name="twitter:description" content="Premium footwear curated for style and comfort. Discover the latest drops from top brands." />
  <meta name="twitter:image" content="imgs/general/favicon.jpg" />
</head>
<body>

  <div id="loader">
    <div class="loader-wrap">
      <div class="loader-ring"></div>
      <img class="loader-logo" src="imgs/general/logo-black.png" alt="Recool" />
    </div>
  </div>

  <div id="app">
    <div id="header"></div>
    <div id="pageContent"></div>
    <div id="footer"></div>
  </div>

  <div class="popup-overlay" id="popupOverlay"></div>
  <div class="popup-panel" id="popupPanel">
    <button class="close-btn" id="closePopup">✕</button>
    <h2>Request a Call</h2>
    <p class="sub">Interested in a product? Leave your details and we'll get back to you within 24 hours.</p>
    <div class="form-group"><label>Full Name</label><input type="text" placeholder="John Doe" /></div>
    <div class="form-group"><label>Email Address</label><input type="email" placeholder="john@example.com" /></div>
    <div class="form-group"><label>Phone Number</label><input type="tel" placeholder="+1 234 567 890" /></div>
    <div class="form-group"><label>Message</label><textarea placeholder="Tell us about your interest..."></textarea></div>
    <button class="submit-btn">Send Request</button>
  </div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-panel">
      <button class="detail-close" id="detailClose">✕</button>
      <div class="detail-layout">
        <div class="detail-img"><img id="detailImg" src="" alt="" /></div>
        <div class="detail-info">
          <div class="detail-brand" id="detailBrand"></div>
          <h2 id="detailName"></h2>
          <div class="detail-sub" id="detailSub"></div>
          <p id="detailDesc"></p>
          <ul id="detailFeatures"></ul>
          <div class="detail-actions">
            <a class="wa-btn" id="shareWa" href="#" target="_blank">Share on WhatsApp</a>
            <button id="copyLink">Copy Link</button>
            <button id="detailCompareBtn" onclick="RecoolApp.detailCompare()">Compare</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/lib.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
